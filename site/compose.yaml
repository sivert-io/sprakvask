services:
  sprakvask-site:
    image: ${SPRAKVASK_IMAGE:-sprakvask-site:local}
    build:
      context: ..
      dockerfile: site/Dockerfile
    container_name: sprakvask-site
    restart: unless-stopped
    ports:
      - "${SPRAKVASK_BIND:-0.0.0.0}:${SPRAKVASK_PORT:-3544}:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

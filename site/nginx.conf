server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/ld+json application/xml image/svg+xml;

  # Only `expires` is used below, never add_header: an add_header inside a
  # location would silently drop the security headers set on the server.

  location = /index.html {
    expires -1;
  }

  # Vite fingerprints its bundles (index-CD6ZeAtM.js), so they never change under
  # the same name. The brand files beside them in /assets/ are not fingerprinted.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
    expires max;
    access_log off;
  }

  location /fonts/ {
    expires 1y;
    access_log off;
  }

  location ~* \.(?:png|svg)$ {
    expires 1d;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
